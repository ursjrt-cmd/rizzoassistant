<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jacky Cool - AI Voice Interface</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --success-color: #00ff88;
            --error-color: #ff3366;
            --red-bar-bg: #c91414; /* Matches screenshot red */
            --red-bar-dark: #630505;
            --cyan-text: #00ffff; /* Matches screenshot text */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Video Background */
        #assistantVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            object-fit: cover;
            object-position: center center;
            transition: filter 0.5s ease;
        }

        /* Ambient Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* UI Container */
        .ui-layer {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: max(15px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(15px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
        }

        #mainWindow {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #ffffff;
            z-index: 9999;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #emptySpace {
            flex-grow: 1;
            transition: all 0.5s ease;
        }

        /* Modern Control Panel */
        .controls-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 40px;
        }

        .button-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        /* Animated GO Button */
        .go-btn {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg, #141e30, #243b55);
            border: 2px solid var(--accent-color);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            animation: pulse-go 2s infinite;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .go-btn:active {
            transform: scale(0.92);
        }

        @keyframes pulse-go {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 212, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }

        /* --- Custom Red Progress Bar (Based on Uploaded Images) --- */
        .red-progress-bar {
            background-color: var(--red-bar-bg);
            border: 4px solid var(--red-bar-dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 25px;
            gap: 20px;
            min-width: 320px;
            max-width: 90%;
            border-radius: 4px;
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        .progress-text {
            color: var(--cyan-text);
            font-size: 28px;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace; /* Terminal style */
            text-transform: lowercase;
            letter-spacing: 2px;
            min-width: 180px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        .progress-blocks {
            display: flex;
            gap: 6px;
        }

        .progress-blocks span {
            display: block;
            width: 14px;
            height: 28px;
            background-color: var(--red-bar-dark);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        /* Animation to make blocks light up like a progress meter */
        @keyframes blockFlash {
            0%, 100% { background-color: var(--red-bar-dark); box-shadow: inset 0 0 5px rgba(0,0,0,0.8); }
            50% { background-color: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }
        }

        .red-progress-bar.active .progress-blocks span {
            animation: blockFlash 1.2s infinite;
        }

        /* Staggered animation delays for the block effect */
        .red-progress-bar.active .progress-blocks span:nth-child(1) { animation-delay: 0.0s; }
        .red-progress-bar.active .progress-blocks span:nth-child(2) { animation-delay: 0.2s; }
        .red-progress-bar.active .progress-blocks span:nth-child(3) { animation-delay: 0.4s; }
        .red-progress-bar.active .progress-blocks span:nth-child(4) { animation-delay: 0.6s; }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        @media (min-width: 768px) {
            .ui-layer { padding: 40px; }
            .go-btn { width: 90px; height: 90px; font-size: 22px; }
            .red-progress-bar { bottom: 15%; padding: 15px 40px; }
            .progress-text { font-size: 36px; min-width: 240px; }
            .progress-blocks span { width: 18px; height: 36px; }
        }
    </style>
</head>
<body>

    <video id="assistantVideo" autoplay loop muted playsinline></video>
    <div class="video-overlay"></div>

    <div id="mainWindow"></div>

    <div class="ui-layer">
        <div id="emptySpace"></div>
        
        <div class="controls-container">
            <!-- GO Button -->
            <div class="button-group">
                <button id="goBtn" class="go-btn" title="Click to Start">GO</button>
            </div>
        </div>

        <!-- Red Progress Bar (Hidden by Default) -->
        <div id="redProgressBar" class="red-progress-bar hidden">
            <div class="progress-blocks">
                <span></span><span></span><span></span><span></span>
            </div>
            <div id="progressText" class="progress-text">Processing</div>
            <div class="progress-blocks">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <script>
        let isSystemLocked = true;
        let failedAttempts = 0; 
        let hasMicPermission = false; 
        
        const _0xPwdArray = [
            [104, 105, 32, 105, 32, 97, 109, 32, 106, 97, 99, 107, 105, 101, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108], 
            [104, 105, 32, 105, 109, 32, 106, 97, 99, 107, 105, 101, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108],         
            [104, 105, 32, 105, 32, 97, 109, 32, 106, 97, 99, 107, 121, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108],    
            [104, 105, 32, 105, 109, 32, 106, 97, 99, 107, 121, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108]             
        ];
        const validPasswords = _0xPwdArray.map(arr => String.fromCharCode(...arr));

        const videoLibrary = {
            locked: 'https://cdn.pixabay.com/video/2020/07/22/45366-443152204_tiny.mp4',       
            askPassword_voice: 'firstvideo.mp4',                                             
            accessGranted: 'secondvideo.mp4',
            accessDenied: 'thirdvideo.mp4',    
            accessDeniedMax: 'fourthvideo.mp4'
        };

        const videoElement = document.getElementById('assistantVideo');
        const overlayElement = document.querySelector('.video-overlay');
        const goBtn = document.getElementById('goBtn');
        const redProgressBar = document.getElementById('redProgressBar');
        const progressText = document.getElementById('progressText');
        const mainWindow = document.getElementById('mainWindow');
        const emptySpace = document.getElementById('emptySpace');

        let currentVideoState = '';

        function setVideoState(state) {
            if (currentVideoState === state) return;
            currentVideoState = state;

            if (state === 'none') {
                videoElement.style.display = 'none';
                overlayElement.style.display = 'none';
                videoElement.pause();
                return;
            }

            videoElement.style.display = 'block';
            overlayElement.style.display = 'block';
            videoElement.src = videoLibrary[state];
            
            if (state.startsWith('askPassword') || state === 'accessGranted' || state === 'accessDenied' || state === 'accessDeniedMax') {
                videoElement.muted = false; 
                videoElement.loop = false;  
            } else {
                videoElement.muted = true;  
                videoElement.loop = true;
            }
            
            videoElement.play().catch(e => console.log("Video Play Error:", e));
        }

        // Initialize with locked video directly
        setVideoState('locked');

        videoElement.addEventListener('ended', () => {
            if (currentVideoState === 'accessGranted') {
                unlockSystemPage();
            } else if (currentVideoState === 'accessDenied' || currentVideoState === 'accessDeniedMax') {
                lockSystem();
            }
        });

        videoElement.addEventListener('error', () => {
            if (currentVideoState === 'accessGranted') {
                unlockSystemPage();
            }
        });

        function unlockSystemPage() {
            isSystemLocked = false;
            emptySpace.style.display = 'none';
            mainWindow.style.display = 'block';
            goBtn.classList.add('hidden');
            redProgressBar.classList.add('hidden');
            redProgressBar.classList.remove('active');
            setVideoState('none');
        }

        // ONE-TIME PERMISSION LOGIC
        async function requestMicrophoneAccess() {
            if (hasMicPermission) return true; 
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                hasMicPermission = true; 
                return true;
            } catch (err) {
                console.error("Microphone access denied:", err);
                alert("Microphone Permission Required to Proceed.");
                return false;
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 5; 

            // 1. Listening Phase replaced with Processing
            recognition.onstart = () => {
                progressText.innerText = "Processing";
            };

            // 2. Processing Phase (Audio captured, waiting for engine)
            recognition.onspeechend = () => {
                recognition.stop();
                progressText.innerText = "Processing";
            };

            // 3. Recognizing Phase
            recognition.onresult = (event) => {
                progressText.innerText = "recognising";
                
                // Keep the exact spoken text hidden as requested

                // Delay execution slightly so the user sees the "recognising" state animation
                setTimeout(() => {
                    if (isSystemLocked) {
                        let isMatchFound = false;
                        const rawTranscript = event.results[0][0].transcript;
                        
                        for (let i = 0; i < event.results[0].length; i++) {
                            let alt = event.results[0][i].transcript.toLowerCase().replace(/[^a-z0-9 ]/g, " ").trim().replace(/\s+/g, " ");
                            if (validPasswords.some(pwd => alt.includes(pwd) || alt === pwd)) {
                                isMatchFound = true;
                                break;
                            }
                        }

                        if (isMatchFound) {
                            failedAttempts = 0;
                            progressText.innerText = "granted";
                            progressText.style.color = "var(--success-color)";
                            setVideoState('accessGranted');
                        } else {
                            failedAttempts++;
                            if (failedAttempts >= 3) {
                                progressText.innerText = "intruder";
                                progressText.style.color = "#ffffff";
                                setVideoState('accessDeniedMax');
                                failedAttempts = 0;
                            } else {
                                progressText.innerText = "denied";
                                progressText.style.color = "#ffffff";
                                setVideoState('accessDenied');
                            }
                        }
                    } else {
                        const rawTranscript = event.results[0][0].transcript;
                        const cleanCommand = rawTranscript.toLowerCase().replace(/[^a-z0-9 ]/g, " ").trim().replace(/\s+/g, " "); 
                        processCommand(cleanCommand);
                    }
                }, 1500); 
            };

            recognition.onerror = (event) => {
                progressText.innerText = "error";
                progressText.style.color = "#ffffff";
                
                setTimeout(() => {
                    if (isSystemLocked && currentVideoState !== 'accessGranted' && currentVideoState !== 'accessDenied') {
                        lockSystem();
                    }
                }, 2000);
            };
        } else {
            alert("Speech recognition unsupported on this browser.");
        }

        /* --- GO BUTTON CLICK FLOW --- */
        goBtn.addEventListener('click', async () => {
            if (!recognition) {
                alert("Voice Engine is unsupported on this browser.");
                return;
            }

            // Play the requested sound immediately upon click
            const startSound = new Audio("Screen Recording 2026-08-27 161210-[AudioTrimmer.com].mp3");
            startSound.play().catch(e => console.warn("Audio play blocked or failed:", e));

            // Request permission. If denied, stop.
            const micPermitted = await requestMicrophoneAccess();
            if (!micPermitted) return;

            // Direct start - hide GO button, trigger video, show red animation bar
            goBtn.classList.add('hidden');
            
            // This setVideoState plays firstvideo.mp4 as per the videoLibrary dictionary
            setVideoState('askPassword_voice'); 
            
            progressText.style.color = "var(--cyan-text)"; // Reset color if previously denied
            redProgressBar.classList.remove('hidden');
            redProgressBar.classList.add('active'); // Starts block animations

            if (isSystemLocked) {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Recognition active state error:", e);
                }
            }
        });

        function processCommand(command) {
            if (command.includes("lock system") || command.includes("close pc") || command.includes("lock workspace")) {
                lockSystem();
            } else {
                console.log("Command received in background.");
            }
        }

        function lockSystem() {
            isSystemLocked = true;
            emptySpace.style.display = 'block';
            mainWindow.style.display = 'none';
            
            // Hide Red Progress Bar and show GO Button
            redProgressBar.classList.add('hidden');
            redProgressBar.classList.remove('active');
            goBtn.classList.remove('hidden');
            
            setVideoState('locked'); 
        }
    </script>
</body>
</html>

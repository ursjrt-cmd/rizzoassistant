<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rizzo - Personal Voice Assistant </title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --success-color: #00ff88;
            --error-color: #ff3366;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Video Background */
        #assistantVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            object-fit: cover;
            transition: filter 0.5s ease;
        }

        /* Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* UI Container */
        .ui-layer {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: max(15px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(15px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
        }

        #mainWindow {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #ffffff;
            z-index: 9999;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #emptySpace {
            flex-grow: 1;
            transition: all 0.5s ease;
        }

        .controls-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 30px 0;
            margin-top: auto;
        }

        .status-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
            min-height: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            padding: 0 10px;
        }

        .button-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        /* Base Round Button Styling */
        .round-btn {
            border-radius: 50%;
            width: 70px;
            height: 70px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            border: 2px solid var(--accent-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .round-btn:active {
            transform: scale(0.92);
        }

        /* Animated GO Button */
        .go-btn {
            background: linear-gradient(135deg, #141e30, #243b55);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            animation: pulse-go 1.8s infinite;
        }

        @keyframes pulse-go {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(0, 212, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }

        /* Authenticate Mic Button */
        .auth-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border-color: #00ff88;
            font-size: 26px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            animation: fadeIn 0.5s ease forwards;
        }

        .auth-btn.listening {
            animation: pulse-mic 1.5s infinite;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ff4b2b;
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.6);
        }

        @keyframes pulse-mic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(255, 75, 43, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); }
        }

        .hidden {
            display: none !important;
        }

        @media (min-width: 768px) {
            .ui-layer { padding: 40px; }
            .round-btn { width: 80px; height: 80px; }
            .go-btn { font-size: 20px; }
            .auth-btn { font-size: 30px; }
        }
    </style>
</head>
<body>

    <video id="assistantVideo" autoplay loop muted playsinline></video>
    <div class="video-overlay"></div>

    <div id="mainWindow"></div>

    <div class="ui-layer">
        <div id="emptySpace"></div>
        <div class="controls-container">
            <div id="statusText" class="status-text">System Standby</div>
            <div class="button-group">
                <button id="goBtn" class="round-btn go-btn" title="Click to Start">GO</button>
                <button id="authBtn" class="round-btn auth-btn hidden" title="Click to Authenticate">🎙️</button>
            </div>
        </div>
    </div>

    <script>
        let isSystemLocked = true;
        let failedAttempts = 0; 
        let authTimer = null;
        let hasMicPermission = false; // Flag to ensure browser prompts only once
        
        const _0xPwdArray = [
            [104, 105, 32, 105, 32, 97, 109, 32, 106, 97, 99, 107, 105, 101, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108], 
            [104, 105, 32, 105, 109, 32, 106, 97, 99, 107, 105, 101, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108],         
            [104, 105, 32, 105, 32, 97, 109, 32, 106, 97, 99, 107, 121, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108],    
            [104, 105, 32, 105, 109, 32, 106, 97, 99, 107, 121, 32, 98, 117, 100, 100, 121, 32, 99, 111, 111, 108]             
        ];
        const validPasswords = _0xPwdArray.map(arr => String.fromCharCode(...arr));

        const videoLibrary = {
            locked: 'https://cdn.pixabay.com/video/2020/07/22/45366-443152204_tiny.mp4',       
            askPassword_voice: 'firstvideo.mp4',                                             
            accessGranted: 'secondvideo.mp4',
            accessDenied: 'thirdvideo.mp4',    
            accessDeniedMax: 'fourthvideo.mp4',                
            listening: 'https://cdn.pixabay.com/video/2020/05/11/38838-422176495_tiny.mp4'
        };

        const videoElement = document.getElementById('assistantVideo');
        const overlayElement = document.querySelector('.video-overlay');
        const statusText = document.getElementById('statusText');
        const goBtn = document.getElementById('goBtn');
        const authBtn = document.getElementById('authBtn');
        const mainWindow = document.getElementById('mainWindow');
        const emptySpace = document.getElementById('emptySpace');

        let currentVideoState = '';

        function setVideoState(state) {
            if (currentVideoState === state) return;
            currentVideoState = state;

            if (state === 'none') {
                videoElement.style.display = 'none';
                overlayElement.style.display = 'none';
                videoElement.pause();
                return;
            }

            videoElement.style.display = 'block';
            overlayElement.style.display = 'block';
            videoElement.src = videoLibrary[state];
            
            if (state.startsWith('askPassword') || state === 'accessGranted' || state === 'accessDenied' || state === 'accessDeniedMax') {
                videoElement.muted = false; 
                videoElement.loop = false;  
            } else {
                videoElement.muted = true;  
                videoElement.loop = true;
            }
            
            videoElement.play().catch(e => console.log("Video Play Error:", e));
        }

        setVideoState('locked');

        videoElement.addEventListener('ended', () => {
            if (currentVideoState === 'accessGranted') {
                unlockSystemPage();
            } else if (currentVideoState === 'accessDenied' || currentVideoState === 'accessDeniedMax') {
                lockSystem();
            }
        });

        videoElement.addEventListener('error', () => {
            if (currentVideoState === 'accessGranted') {
                unlockSystemPage();
            }
        });

        function unlockSystemPage() {
            isSystemLocked = false;
            emptySpace.style.display = 'none';
            mainWindow.style.display = 'block';
            statusText.innerText = ""; 
            goBtn.classList.add('hidden');
            authBtn.classList.add('hidden'); 
            setVideoState('none');
        }

        // ONE-TIME PERMISSION LOGIC
        async function requestMicrophoneAccess() {
            if (hasMicPermission) return true; // Skip browser prompt if already allowed this session
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                hasMicPermission = true; // Mark as permitted
                return true;
            } catch (err) {
                console.error("Microphone access denied:", err);
                statusText.innerText = "Microphone Permission Required";
                statusText.style.color = "var(--error-color)";
                return false;
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 5; 

            recognition.onstart = () => {
                statusText.innerText = "Listening...";
                statusText.style.color = "var(--accent-color)";
                authBtn.classList.add('listening');
            };

            recognition.onspeechend = () => {
                recognition.stop();
                authBtn.classList.remove('listening');
            };

            recognition.onresult = (event) => {
                if (isSystemLocked) {
                    statusText.innerText = `Analyzing Voice...`;
                    let isMatchFound = false;
                    
                    for (let i = 0; i < event.results[0].length; i++) {
                        let alt = event.results[0][i].transcript.toLowerCase().replace(/[^a-z0-9 ]/g, " ").trim().replace(/\s+/g, " ");
                        if (validPasswords.some(pwd => alt.includes(pwd) || alt === pwd)) {
                            isMatchFound = true;
                            break;
                        }
                    }

                    if (isMatchFound) {
                        failedAttempts = 0;
                        statusText.innerText = "Authentication Successful.";
                        statusText.style.color = "var(--success-color)";
                        setVideoState('accessGranted');
                    } else {
                        failedAttempts++;
                        if (failedAttempts >= 3) {
                            statusText.innerText = "Maximum attempts reached. Intruder detected.";
                            statusText.style.color = "var(--error-color)";
                            setVideoState('accessDeniedMax');
                            failedAttempts = 0;
                        } else {
                            statusText.innerText = "";
                            setVideoState('accessDenied');
                        }
                    }
                } else {
                    const transcript = event.results[0][0].transcript.toLowerCase();
                    const cleanCommand = transcript.replace(/[^a-z0-9 ]/g, " ").trim().replace(/\s+/g, " "); 
                    processCommand(cleanCommand);
                }
            };

            recognition.onerror = (event) => {
                statusText.innerText = 'Audio lost or timed out.';
                statusText.style.color = 'var(--error-color)';
                authBtn.classList.remove('listening');
                setTimeout(() => {
                    if (isSystemLocked && currentVideoState !== 'accessGranted' && currentVideoState !== 'accessDenied') {
                        lockSystem();
                    }
                }, 2000);
            };
        } else {
            statusText.innerText = "Speech recognition unsupported on this browser.";
        }

        /* --- GO BUTTON CLICK FLOW --- */
        goBtn.addEventListener('click', () => {
            statusText.innerText = "";
            goBtn.classList.add('hidden');
            setVideoState('askPassword_voice');

            clearTimeout(authTimer);
            authTimer = setTimeout(() => {
                authBtn.classList.remove('hidden');
            }, 5500);
        });

        /* --- AUTHENTICATE BUTTON CLICK FLOW --- */
        authBtn.addEventListener('click', async () => {
            if (!recognition) {
                alert("Voice Engine is unsupported on this browser.");
                return;
            }

            // Checks permission once; skips popup on subsequent clicks
            const micPermitted = await requestMicrophoneAccess();
            if (!micPermitted) return;

            if (isSystemLocked) {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                statusText.innerText = "Authenticating...";
                statusText.style.color = "var(--accent-color)";
                
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Recognition active state error:", e);
                }
            } else {
                try { 
                    recognition.start(); 
                } catch (e) { 
                    console.log("Recognition error:", e); 
                }
            }
        });

        function processCommand(command) {
            if (command.includes("lock system") || command.includes("close pc") || command.includes("lock workspace")) {
                lockSystem();
            } else {
                statusText.innerText = "Command received.";
            }
        }

        function lockSystem() {
            clearTimeout(authTimer);
            isSystemLocked = true;
            emptySpace.style.display = 'block';
            mainWindow.style.display = 'none';
            
            goBtn.classList.remove('hidden');
            authBtn.classList.add('hidden');
            authBtn.classList.remove('listening');
            
            statusText.innerText = "System Standby";
            statusText.style.color = "rgba(255, 255, 255, 0.7)";
            setVideoState('locked'); 
        }
    </script>
</body>
</html>
